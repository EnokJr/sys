<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh;transition:background .3s,color .3s}

/* ── Tema escuro (padrão) ── */
:root{
  --bg:#080c14;--bg2:#0f1525;--bg3:#111827;--bg4:#1a2030;
  --border:#1e2540;--border2:#2a3050;
  --txt:#e8eaf0;--txt2:#8a94a8;--txt3:#5a6478;--txt4:#3d4a60;--txt5:#2d3a52;
  --header-bg:rgba(8,12,20,.95);
  --card-bg:linear-gradient(135deg,#0f1525 0%,#111827 100%);
  --footer-border:#1a2030;
  --tag-txt:#e8eaf0;
  --toggle-bg:#1a2030;--toggle-border:#2a3050;--toggle-icon:#8a94a8;
  --panel-bg:#0a0f1e;--panel-border:#1e2540;
  --streak-bg:#1a1500;--streak-border:#3d3000;
  --chip-bg:rgba(110,168,254,.06);--chip-border:#1e2540;
}
/* ── Tema claro ── */
:root.light{
  --bg:#f0f4fa;--bg2:#ffffff;--bg3:#f8fafd;--bg4:#edf1f8;
  --border:#d0d9eb;--border2:#c0ccdf;
  --txt:#0f1a2e;--txt2:#3a4a65;--txt3:#5a6a85;--txt4:#7a8aa5;--txt5:#9aaabf;
  --header-bg:rgba(240,244,250,.95);
  --card-bg:linear-gradient(135deg,#ffffff 0%,#f8fafd 100%);
  --footer-border:#dde4f0;
  --tag-txt:#0f1a2e;
  --toggle-bg:#e0e8f5;--toggle-border:#c0ccdf;--toggle-icon:#3a4a65;
  --panel-bg:#f8fafd;--panel-border:#d0d9eb;
  --streak-bg:#fffbeb;--streak-border:#fcd34d;
  --chip-bg:rgba(59,130,246,.06);--chip-border:#d0d9eb;
}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Animações ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes orb{0%,100%{transform:scale(1) translate(0,0)}33%{transform:scale(1.08) translate(10px,-8px)}66%{transform:scale(.95) translate(-8px,6px)}}
@keyframes logoSpin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.fade-in{animation:fadeIn .5s ease both}

/* ── Cards ── */
.app-card{
  position:relative;overflow:hidden;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:20px;padding:28px 24px;cursor:pointer;
  transition:transform .25s,border-color .25s,box-shadow .25s;
  text-decoration:none;display:block;
  animation:cardIn .45s ease both;
}
.app-card:hover{transform:translateY(-5px)}
.app-card.sdc:hover{border-color:#1D9E7566;box-shadow:0 20px 56px rgba(29,158,117,.14)}
.app-card.forjadora:hover{border-color:#EF9F2766;box-shadow:0 20px 56px rgba(239,159,39,.14)}
.app-card.future:hover{border-color:#6ea8fe44;box-shadow:0 20px 56px rgba(110,168,254,.08)}
.app-card::before{
  content:'';position:absolute;inset:0;opacity:0;
  transition:opacity .3s;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.04),transparent 70%);
}
.app-card:hover::before{opacity:1}

/* Badge de alerta */
.alert-badge{
  position:absolute;top:-4px;right:-4px;width:12px;height:12px;
  border-radius:50%;background:#EF9F27;border:2px solid var(--bg);
  animation:pulse 2s infinite;
}

/* ── Tags ── */
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
.tag.live{background:#1D9E7520;color:#1D9E75;border:1px solid #1D9E7540}
.tag.soon{background:#6ea8fe15;color:#6ea8fe;border:1px solid #6ea8fe25}
.tag.beta{background:#EF9F2720;color:#EF9F27;border:1px solid #EF9F2740}

/* ── Atalhos clicáveis ── */
.shortcut-chip{
  font-size:11px;padding:4px 10px;border-radius:20px;
  background:var(--chip-bg);color:var(--txt3);border:1px solid var(--chip-border);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.shortcut-chip:hover{background:rgba(110,168,254,.12);color:var(--txt2);border-color:rgba(110,168,254,.3)}

/* ── Toggle ── */
.theme-toggle{width:36px;height:36px;border-radius:10px;background:var(--toggle-bg);border:1px solid var(--toggle-border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex-shrink:0;color:var(--toggle-icon);font-size:16px}
.theme-toggle:hover{border-color:var(--border2)}

/* ── Painel de vida ── */
.life-panel{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:16px 24px;max-width:960px;margin:0 auto 0;
}
.life-card{
  background:var(--panel-bg);border:1px solid var(--panel-border);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .2s;
}
.life-card:hover{border-color:var(--border2)}
.alert-wrap{max-width:960px;margin:0 auto;padding:12px 24px 0}

/* ── Banner de data/contexto ── */
.context-banner{
  padding:20px 24px 0;max-width:960px;margin:0 auto;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}

/* ── Streak badge ── */
.streak-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--streak-bg);border:1px solid var(--streak-border);
  border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;color:#EF9F27;
}

/* ── Feed de atividade ── */
.activity-section{
  padding:16px 24px 0;max-width:960px;margin:0 auto;
}
.activity-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--footer-border);
  font-size:12px;color:var(--txt3);
}
.activity-row:last-child{border-bottom:none}
.activity-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── Drawer de perfil ── */
.changelog-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.changelog-modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:24px 24px 32px;max-height:70vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.changelog-version-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.changelog-version-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.5px}
.changelog-date{font-size:11px;color:var(--txt4)}
.changelog-item{font-size:13px;color:var(--txt3);line-height:1.6;padding-left:12px;position:relative;margin-bottom:3px}
.changelog-item::before{content:"·";position:absolute;left:0;color:var(--txt4)}
.changelog-divider{border:none;border-top:1px solid var(--footer-border);margin:16px 0}
.version-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;cursor:pointer;transition:opacity .15s;user-select:none}
.version-badge:hover{opacity:.75}
.profile-drawer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
  animation:fadeIn .2s ease;
}
.profile-drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(320px,90vw);
  background:var(--bg2);border-left:1px solid var(--border);
  z-index:101;padding:24px;overflow-y:auto;
  animation:slideInRight .25s ease;
}

/* ── Mobile ── */
@media(max-width:600px){
  .life-panel{grid-template-columns:1fr}
  .hub-grid{grid-template-columns:1fr !important}
  .header-right-info{display:none}
  .profile-drawer{width:100vw}
  .context-banner{padding:14px 16px 0}
  .life-panel,.activity-section{padding-left:16px;padding-right:16px}
  .alert-wrap{padding-left:16px;padding-right:16px}
  .app-card{padding:22px 18px}
  .hub-grid-wrapper{padding:0 16px !important}
}
@media(max-width:400px){
  .theme-toggle{width:32px;height:32px;font-size:14px}
}
</style>
</head>

const { useState, useEffect, useRef, useCallback } = React;

// ── Utilitários ──
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit" });
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const now = new Date();
  const diffH = (now - d) / 3600000;
  if (diffH < 1) return "agora há pouco";
  if (diffH < 24) return `${Math.floor(diffH)}h atrás`;
  if (diffH < 48) return "ontem";
  return fmtDate(iso);
}
function getDayName() {
  return new Date().toLocaleDateString("pt-BR", { weekday:"long" });
}
function getDateStr() {
  return new Date().toLocaleDateString("pt-BR", { day:"2-digit", month:"long" });
}

// ── Hook de tema ──
function useTheme() {
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem("sys_theme") !== "light"; } catch(e) { return true; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle("light", !dark);
    try { localStorage.setItem("sys_theme", dark ? "dark" : "light"); } catch(e) {}
  }, [dark]);
  return [dark, () => setDark(d => !d)];
}

// ── Hook de streak diário ──
function useStreak() {
  const [streak, setStreak] = useState(0);
  useEffect(() => {
    try {
      const data = JSON.parse(localStorage.getItem("sys_streak") || "{}");
      const today = new Date().toDateString();
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      if (data.lastDay === today) {
        setStreak(data.count || 1);
      } else if (data.lastDay === yesterday) {
        const newCount = (data.count || 0) + 1;
        localStorage.setItem("sys_streak", JSON.stringify({ lastDay: today, count: newCount }));
        setStreak(newCount);
      } else {
        localStorage.setItem("sys_streak", JSON.stringify({ lastDay: today, count: 1 }));
        setStreak(1);
      }
    } catch(e) { setStreak(1); }
  }, []);
  return streak;
}

// ── Painel de Vida (mini-resumos dos apps) ──
function LifePanel({ user }) {
  const email = user?.email || "anon";

  // Lê dados dos apps via localStorage
  const sdcData = React.useMemo(() => {
    try {
      const raw = localStorage.getItem("sdc_summary");
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }, []);

  const forjData = React.useMemo(() => {
    try {
      const raw = localStorage.getItem("forj_summary");
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }, []);

  // Missão prioritária da Forjadora
  const activeMission = React.useMemo(() => {
    try {
      const raw = localStorage.getItem("sheyla_forjadora_v3");
      if (!raw) return null;
      const app = JSON.parse(raw);
      const missions = app.missions || [];
      return missions.find(m => m.active && !m.done && m.priority) || missions.find(m => m.active && !m.done) || null;
    } catch(e) { return null; }
  }, []);

  // helpers de cor por elemento
  const ELEM = {
    m:{ label:"M", color:"#22c55e" },
    g:{ label:"G", color:"#38bdf8" },
    t:{ label:"T", color:"#a855f7" },
    f:{ label:"F", color:"#f97316" },
  };
  const ROSA = new Set(["I","N","T","J"]);

  const ce = (tag, props, ...children) => React.createElement(tag, props, ...children);

  // Helper: "sincronizado há X"
  const timeAgo = (ts) => {
    if(!ts) return null;
    const diff = Math.floor((Date.now() - ts) / 1000);
    if(diff < 60) return "agora mesmo";
    if(diff < 3600) return `${Math.floor(diff/60)} min atrás`;
    if(diff < 86400) return `${Math.floor(diff/3600)}h atrás`;
    return `${Math.floor(diff/86400)}d atrás`;
  };

  // Forjadora element pills
  const ElemPills = ({ d }) =>
    ce("div", { style:{ display:"flex", gap:5, flexWrap:"wrap", margin:"8px 0 4px" } },
      ["m","g","t","f"].map(k => {
        const val = d[k] ?? "—";
        const { label, color } = ELEM[k];
        return ce("div", { key:k, style:{ display:"flex", flexDirection:"column", alignItems:"center", background: color+"18", border:"1px solid "+color+"44", borderRadius:8, padding:"4px 10px", minWidth:40 } },
          ce("span", { style:{ fontSize:16, fontWeight:700, color, fontFamily:"Rajdhani,sans-serif" } }, val),
          ce("span", { style:{ fontSize:8, letterSpacing:1, color, opacity:.7, fontFamily:"Rajdhani,sans-serif" } }, label)
        );
      })
    );

  // MBTI letter pills
  const MbtiPills = ({ type }) => {
    if(!type || type.length !== 4) return null;
    return ce("div", { style:{ display:"flex", gap:4, alignItems:"center" } },
      type.split("").map((l,i) => {

// ── Feed de atividade recente ──
function ActivityFeed({ user }) {
  const email = user?.email || "anon";
  const ce = (tag, props, ...children) => React.createElement(tag, props, ...children);

  const events = React.useMemo(() => {
    const list = [];

    // Acessos aos apps
    APPS.filter(a => a.url).forEach(app => {
      try {
        const info = JSON.parse(localStorage.getItem(`sys_access_${app.id}_${email}`) || "null");
        if (info?.last) list.push({ ts: new Date(info.last).getTime(), color: app.cor, icon:"🔗", label:`Acessou ${app.nome}`, detail: info.count+"x acessado", type:"access" });
      } catch(e) {}
    });

    // Missões concluídas recentes da Forjadora (últimas 3)
    try {
      const raw = localStorage.getItem("sheyla_forjadora_v3");
      if (raw) {
        const app = JSON.parse(raw);
        const done = (app.missions || []).filter(m => m.done && m.doneAt).sort((a,b)=> b.doneAt - a.doneAt).slice(0,3);
        done.forEach(m => {
          list.push({ ts: m.doneAt, color:"#a855f7", icon:"✦", label:`Missão concluída: ${m.title}`, detail: m.xp ? "+"+m.xp+" XP" : "", type:"mission" });
        });
        // Check-in recente
        const checkins = (app.checkinLog || []).slice(-3);
        checkins.forEach(c => {
          if (!c.ts) return;
          list.push({ ts: c.ts, color:"#EF9F27", icon:"📍", label:`Check-in: "${(c.resp||c.q||"").slice(0,40)}"`, detail:"Forjadora", type:"checkin" });
        });
      }
    } catch(e) {}

    // Contas vencidas do SDC
    try {
      const sdc = JSON.parse(localStorage.getItem("sdc_v3") || "null");
      if (sdc) {
        const today = new Date(); today.setHours(0,0,0,0);
        const venc = (sdc.transacoes || []).filter(t => !t.pago && t.tipo === "saida" && t.vencimento && new Date(t.vencimento) < today);
        if (venc.length > 0) {
          list.push({ ts: Date.now() - 60000, color:"#E24B4A", icon:"⚠", label:`${venc.length} conta(s) vencida(s) no SDC`, detail:"Pendente", type:"alert" });
        }
        // Último fechamento
        const fech = (sdc.fechamentos || []).slice(-1)[0];
        if (fech?.data) list.push({ ts: new Date(fech.data+"T00:00").getTime(), color:"#1D9E75", icon:"✔", label:`Fechamento ${fech.data}`, detail: fech.saldo != null ? "saldo: "+fech.saldo : "", type:"fechamento" });
      }
    } catch(e) {}

    list.sort((a,b) => b.ts - a.ts);
    return list.slice(0, 8);
  }, [email]);

  const lastSysLogin = React.useMemo(() => { try { return localStorage.getItem("sys_last_login"); } catch(e) { return null; } }, []);

  if (!events.length && !lastSysLogin) return null;

  return ce("div", { className:"activity-section" },
    ce("div", { style:{ fontSize:10, letterSpacing:2, color:"var(--txt4)", fontWeight:700, marginBottom:10 } }, "ATIVIDADE RECENTE"),
    lastSysLogin && ce("div", { className:"activity-row" },
      ce("div", { className:"activity-dot", style:{ background:"#6ea8fe" } }),
      ce("span", null, "Último acesso ao Hub: "),
      ce("span", { style:{ color:"var(--txt2)", marginLeft:4 } }, fmtTime(lastSysLogin))
    ),
    ...events.map((ev, i) =>
      ce("div", { key:i, className:"activity-row" },
        ce("div", { className:"activity-dot", style:{ background: ev.color } }),
        ce("span", { style:{ fontSize:11, lineHeight:1.4 } },
          ce("span", { style:{ marginRight:4 } }, ev.icon),
          ev.label
        ),
        ev.detail && ce("span", { style:{ marginLeft:"auto", fontSize:10, color:"var(--txt4)", whiteSpace:"nowrap" } }, ev.detail)
      )
    )
  );
}

  const lastAccessedId = React.useMemo(() => {
    let best = null, bestTime = 0;
    APPS.filter(a => a.url).forEach(a => {

        const info = JSON.parse(localStorage.getItem(`sys_access_${a.id}_${user?.email || "anon"}`) || "null");
        if (info?.last && new Date(info.last) > bestTime) { bestTime = new Date(info.last); best = a.id; }

  const bgGradient = React.useMemo(() => {
    if (hora >= 6 && hora < 12) return dark
      ? "radial-gradient(ellipse at 60% 0%,rgba(59,130,246,.04) 0%,transparent 60%)"
      : "radial-gradient(ellipse at 60% 0%,rgba(59,130,246,.06) 0%,transparent 60%)";
    if (hora >= 12 && hora < 18) return dark
      ? "radial-gradient(ellipse at 70% 0%,rgba(29,158,117,.04) 0%,transparent 60%)"
      : "radial-gradient(ellipse at 70% 0%,rgba(29,158,117,.06) 0%,transparent 60%)";
    return dark
      ? "radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.05) 0%,transparent 60%)"
      : "radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.07) 0%,transparent 60%)";
  }, [hora, dark]);

  const openApp = (app) => {
    setLaunching(app.id);
    setTimeout(() => { window.location.href = app.url; }, 280);
  };

  const firstName = user.displayName?.split(" ")[0] || user.email?.split("@")[0] || "Sheyla";
  const avatar = user.photoURL;
  const greeting = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";

  return React.createElement("div", {
    style: { minHeight:"100vh", background:"var(--bg)", paddingBottom:60, position:"relative" }
  },
    // Gradiente de fundo dinâmico
    React.createElement("div", { style:{
      position:"fixed", inset:0, pointerEvents:"none",
      background: bgGradient, zIndex:0
    }}),

    // Drawer de perfil
    showProfile && React.createElement(ProfileDrawer, {
      user, onClose:()=>setShowProfile(false),
      streak, dark, toggleTheme
    }),

    // ── Header ──
    React.createElement("div", { style:{
      padding:"18px 24px", display:"flex", justifyContent:"space-between", alignItems:"center",
      borderBottom:"1px solid var(--border)",
      background:"var(--header-bg)", backdropFilter:"blur(12px)",
      position:"sticky", top:0, zIndex:50
    }},
      // Logo
      React.createElement("div", { style:{ display:"flex", alignItems:"center", gap:10 } },
        React.createElement("img", { src: LOGO_B64, style:{ width:32, height:32, borderRadius:8 } }),
        React.createElement("div", null,
          React.createElement("span", { style:{ fontSize:13, fontWeight:700, color:"#6ea8fe", letterSpacing:2 } }, "SYS"),
          React.createElement("span", { style:{ fontSize:13, color:"var(--txt4)", marginLeft:6 } }, "· Primordial")
        )
      ),

      // Right side
      React.createElement("div", { style:{ display:"flex", alignItems:"center", gap:8 } },
        // User info (oculta em mobile pequeno)
        React.createElement("div", { className:"header-right-info", style:{ textAlign:"right", lineHeight:1.3 } },
          React.createElement("div", { style:{ fontSize:13, fontWeight:600, color:"var(--txt)" } }, firstName),
          React.createElement("div", { style:{ fontSize:10, color:"var(--txt4)" } }, user?.email || "")
        ),
        // Avatar (clicável → perfil)
        React.createElement("div", {
          onClick:()=>setShowProfile(true),
          style:{ cursor:"pointer", position:"relative" }
        },
          avatar
            ? React.createElement("img", { src:avatar, style:{ width:34, height:34, borderRadius:"50%", border:"2px solid var(--border2)" }})
            : React.createElement("div", { style:{
                width:34, height:34, borderRadius:"50%", background:"#1a2847",
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:14, fontWeight:700, color:"#6ea8fe", border:"2px solid var(--border2)"
              } }, firstName[0])
        ),
        React.createElement("button", {
          className:"theme-toggle",
          onClick: toggleTheme,
          title: dark ? "Modo claro" : "Modo escuro"
        }, dark ? "☀️" : "🌙"),
        React.createElement("button", {
          onClick: onLogout,
          style:{
            fontSize:12, padding:"6px 12px", borderRadius:10,
            background:"transparent", border:"1px solid var(--border)",
            color:"var(--txt4)", cursor:"pointer", transition:"all .2s"
          },
          onMouseEnter:e=>{e.target.style.borderColor="#E24B4A44";e.target.style.color="#E24B4A"},
          onMouseLeave:e=>{e.target.style.borderColor="var(--border)";e.target.style.color="var(--txt4)"}
        }, "Sair")
      )
    ),

    // ── Conteúdo (relativo ao fixed bg) ──
    React.createElement("div", { style:{ position:"relative", zIndex:1 } },

      // Banner de contexto
      React.createElement("div", { className:"context-banner" },
        React.createElement("span", { style:{ fontSize:12, color:"var(--txt3)", textTransform:"capitalize" } },
          getDayName() + ", " + getDateStr()
        ),
        streak >= 2 && React.createElement("span", { className:"streak-badge" },
          "🔥 ", streak, " dias seguidos"
        )
      ),

      // Hero
      React.createElement("div", { className:"fade-in", style:{ padding:"32px 24px 20px", maxWidth:640, margin:"0 auto" } },
        React.createElement("div", { style:{ fontSize:13, color:"var(--txt3)", marginBottom:8, letterSpacing:1 } }, greeting + ","),
        React.createElement("div", { style:{ fontSize:32, fontWeight:700, color:"var(--txt)", letterSpacing:-1, lineHeight:1.2, marginBottom:10 } },
          firstName + "."
        ),
        React.createElement("div", { style:{ fontSize:14, color:"var(--txt3)", lineHeight:1.6 } },
          "Sou a Sheyla Primordial, a primeira das Sheylas. Meu propósito é reunir minhas irmãs, cada uma com seu jeito e sua missão, para te ajudar no dia a dia, facilitar sua vida e apoiar sua evolução. Evoluímos junto com você. Escolha uma irmã; sua sessão é compartilhada, sem novo login."
        )
      ),

      // Alerta global de contas vencidas (SDC)
      React.createElement(VencidosAlert, null),

      // Painel de vida
      React.createElement(LifePanel, { user }),

      // Feed de atividade
      React.createElement(ActivityFeed, { user }),

      // Grid de apps
      React.createElement("div", {
        className:"hub-grid-wrapper",
        style:{ padding:"20px 24px", maxWidth:960, margin:"0 auto" }
      },
        React.createElement("div", {
          className:"hub-grid",
          style:{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))", gap:16 }
        },
          ...APPS.map((app, i) => React.createElement("div", {
            key:app.id,
            style:{ animationDelay:`${i * .07}s`, position:"relative" }
          },
            launching === app.id && React.createElement("div", { style:{
              position:"absolute", inset:0, zIndex:10, borderRadius:20,
              background:"rgba(8,12,20,.75)", backdropFilter:"blur(4px)",
              display:"flex", alignItems:"center", justifyContent:"center"
            }},
              React.createElement("div", { style:{ fontSize:13, color: app.cor, animation:"pulse .8s infinite" } }, "Abrindo…")
            ),
            React.createElement(AppCard, { app, user, onOpen: openApp })
          ))
        )
      ),

      // Footer
      React.createElement("div", { style:{ textAlign:"center", marginTop:40, fontSize:11, color:"var(--txt5)", letterSpacing:1 } },
        "UNIVERSO SHEYLA · ", new Date().getFullYear()
      )
    )
  );
}

// ── App principal ──
function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loginLoading, setLoginLoading] = useState(false);
  const [previewMode, setPreviewMode] = useState(false);
  const [rev, setRev] = useState(0);

  // Ao voltar de uma irmã (botão Voltar do navegador ou fechamento do app embutido), atualiza o Hub
  useEffect(() => {
    const onShow = (e) => { if (e.persisted) location.reload(); };
    const onRefresh = () => setRev(r => r + 1);
    window.addEventListener("pageshow", onShow);
    window.addEventListener("sheyla:refresh", onRefresh);
    return () => { window.removeEventListener("pageshow", onShow); window.removeEventListener("sheyla:refresh", onRefresh); };
  }, []);

  useEffect(() => {
    if (_isFileProtocol || !window.Sheyla) { setLoading(false); return; }
    const SUMMARY_LS = {};
    APPS.forEach(a => { if (a.painel) SUMMARY_LS[a.id] = a.painel.resumoKey || (a.id + "_summary"); });
    Sheyla.init("sys")
      .then(async () => {
        // Hidrata os resumos da nuvem quando o navegador não tem ou está desatualizado
        try {
          if (Sheyla.user()) {
            const cloud = await Sheyla.summaries();
            Object.keys(SUMMARY_LS).forEach(app => {
              const c = cloud && cloud[app];
              if (!c) return;
              let local = null;
              try { local = JSON.parse(localStorage.getItem(SUMMARY_LS[app]) || "null"); } catch(e) {}
              if (!local || (c.updatedAt || 0) > (local.updatedAt || 0)) {
                try { localStorage.setItem(SUMMARY_LS[app], JSON.stringify(c)); } catch(e) {}
              }
            });
          }
        } catch(e) { console.warn("[SYS] resumos da nuvem:", e); }
        setUser(Sheyla.user()); setLoading(false);
      })
      .catch(() => { setLoading(false); });
  }, []);

  const handleLogin = async () => {
    if (_isFileProtocol || !window.Sheyla) { setPreviewMode(true); return; }
    setLoginLoading(true);
    try {
      const u = await Sheyla.signIn();
      if (u) setUser(u);
    } catch(e) {
      setPreviewMode(true);
    }
    setLoginLoading(false);
  };

  const handleLogout = async () => {
    if (previewMode) { setPreviewMode(false); return; }
    if (!confirm("Sair da conta Google?\n\nVocê precisará fazer login novamente.")) return;
    await Sheyla.signOut();
    setUser(null);
  };

  const isPreview = _isFileProtocol || !window.Sheyla || previewMode;
  const previewUser = { displayName: "Sheyla", email: "sheyla@example.com", photoURL: null };

  if (loading && !isPreview) return React.createElement("div", {
    style:{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#080c14" }
  },
    React.createElement("div", { style:{ fontSize:13, color:"#2d3a52", animation:"pulse 1s infinite" } }, "✦")
  );

  if (!user && !isPreview) return React.createElement(LoginScreen, { onLogin: handleLogin, loading: loginLoading });

  return React.createElement(Hub, { key: rev, user: user || previewUser, onLogout: handleLogout, isPreview });
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
