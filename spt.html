<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B4D3A">
<title>Sheyla Pet</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="core/sheyla-core.js?v=4"></script>
<style>
:root{
  --esm-900:#0B4D3A; --esm-700:#12805C; --esm-300:#6EE7B7; --esm-100:#CFF5E4;
  --lar-500:#F59A3B; --lar-700:#D9701F;
  --creme:#FFF3E0; --creme2:#FFE7C2; --branco:#FFFDF8;
  --tinta:#0F3B2E; --tinta2:#3C6B5A; --erro:#B3261E;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.grande{font-size:20px}
body{margin:0;min-height:100vh;background:var(--creme);color:var(--tinta);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;line-height:1.45;
  background-image:radial-gradient(circle at 1px 1px,rgba(15,59,46,.07) 1.5px,transparent 0);background-size:22px 22px}
h1,h2,h3{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;margin:0;line-height:1.15;color:var(--esm-900)}
h1{font-size:1.7rem} h2{font-size:1.3rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--esm-900);outline-offset:3px;box-shadow:0 0 0 3px #fff}
.topbar{position:sticky;top:0;z-index:5;background:var(--esm-900);color:var(--creme);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:60px;border-bottom:4px solid var(--lar-500)}
.topbar .t{flex:1;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.2rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:2px solid rgba(255,243,224,.5);color:var(--creme);border-radius:14px;padding:0 12px;font-weight:800;text-decoration:none;cursor:pointer}
.tbtn:hover{background:rgba(255,243,224,.12)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 56px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:10px 18px;border:3px solid var(--tinta);border-radius:18px;background:var(--lar-500);color:var(--tinta);font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--tinta);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.btn.verde{background:var(--esm-700);color:#fff}
.btn.sec{background:var(--branco)}
.btn.perigo{background:#FFE3DF;color:var(--erro);border-color:var(--erro);box-shadow:0 4px 0 var(--erro)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.row{display:flex;gap:12px}.row>*{flex:1}
.stack>*+*{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--branco);border:2px solid var(--tinta);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem}
.chip.aviso{background:var(--creme2)}
/* Balão da Sheyla */
.bubble{display:flex;gap:12px;align-items:stretch;margin:14px 0}
.bubble .face{flex:none;width:104px;height:104px;border-radius:22px;border:3px solid var(--tinta);overflow:hidden;background:var(--esm-700)}
.bubble .face{align-self:flex-start;height:104px;background-color:var(--esm-700);background-repeat:no-repeat;background-size:114% auto;background-position:45% 0}
.bubble .txt{position:relative;background:var(--branco);border:3px solid var(--tinta);border-radius:6px 20px 20px 20px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--tinta);flex:1;display:flex;flex-direction:column;justify-content:center}
.bubble.oops .txt{background:var(--creme2);border-color:var(--lar-700);box-shadow:0 4px 0 var(--lar-700)}
.bubble.ok .txt{background:var(--esm-100);border-color:var(--esm-700);box-shadow:0 4px 0 var(--esm-700)}
.bubble .who{display:block;font-size:.72rem;font-weight:800;letter-spacing:.5px;color:var(--tinta2);text-transform:uppercase;margin-bottom:2px}
/* Avatar */
.av{border-radius:50%;overflow:hidden;border:4px solid var(--lar-500);background:var(--esm-100);flex:none}
.av img,.av svg{width:100%;height:100%;display:block;object-fit:cover}
/* Seleção de pets */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 14px;background:var(--branco);border:3px solid var(--tinta);border-radius:24px;box-shadow:0 5px 0 var(--tinta);cursor:pointer;font-weight:800;min-height:190px;justify-content:flex-start;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
.tile .av{width:112px;height:112px}
.tile .nm{font-family:"Baloo 2",sans-serif;font-size:1.25rem;line-height:1.1;text-align:center;word-break:break-word}
.tile .sub{font-size:.8rem;color:var(--tinta2);font-weight:700;margin-top:-6px}
.tile.novo{background:transparent;border-style:dashed;box-shadow:none;color:var(--esm-900)}
.tile.novo .mais{width:112px;height:112px;border-radius:50%;border:4px dashed var(--esm-700);display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--esm-700);background:var(--esm-100)}
/* Formulário */
label,.lbl{display:block;font-weight:800;margin:0 0 6px}
.hint{font-size:.82rem;color:var(--tinta2);font-weight:700;margin-top:4px}
input[type=text],input[type=number],input[type=date]{width:100%;min-height:54px;padding:10px 14px;background:var(--branco);border:3px solid var(--tinta);border-radius:16px;font-weight:700}
input[aria-invalid=true]{border-color:var(--erro);background:#FFF1EF}
.opts{display:flex;gap:10px}
.opt{flex:1;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--tinta);border-radius:16px;background:var(--branco);font-weight:800;cursor:pointer}
.opt[aria-checked=true]{background:var(--esm-700);color:#fff;box-shadow:0 4px 0 var(--tinta)}
.opts.big .opt{flex-direction:column;min-height:96px;font-size:1.05rem}
.opts.big .opt .em{font-size:2.2rem;line-height:1}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:700;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--esm-700);flex:none}
.sec-title{margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.foto{display:flex;align-items:center;gap:16px}
.foto .av{width:96px;height:96px}
/* Cartão do pet */
.pcard{background:var(--branco);border:3px solid var(--tinta);border-radius:26px;box-shadow:0 6px 0 var(--tinta);overflow:hidden}
.pcard .head{background:var(--esm-700);padding:22px 16px 56px;text-align:center;color:#fff;position:relative}
.pcard .head h1{color:#fff;font-size:1.9rem}
.pcard .head .esp{font-weight:800;opacity:.95}
.pcard .head .paw{position:absolute;font-size:2rem;opacity:.18;transform:rotate(-18deg)}
.pcard .photo{display:flex;justify-content:center;margin-top:-48px;position:relative;z-index:1}
.pcard .photo .av{width:136px;height:136px;border-width:5px;border-color:var(--lar-500);background:#fff}
.pcard .body{padding:14px 18px 20px}
.dados{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0}
.dados div{background:var(--creme);border:2px solid var(--tinta);border-radius:14px;padding:8px 12px}
.dados dt{font-size:.72rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--tinta2)}
.dados dd{margin:2px 0 0;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.15rem;line-height:1.2;word-break:break-word}
.dados .full{grid-column:1/-1}
.soon{display:grid;gap:10px;margin-top:8px}
.soon div{display:flex;align-items:center;gap:12px;padding:12px 14px;border:3px dashed var(--tinta2);border-radius:18px;color:var(--tinta2);font-weight:800}
.soon small{margin-left:auto;font-size:.7rem;letter-spacing:.5px;text-transform:uppercase;background:var(--creme2);border-radius:999px;padding:2px 10px;color:var(--tinta)}
/* Abertura */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:radial-gradient(circle at 50% 38%,var(--esm-700),var(--esm-900) 72%);color:var(--creme);padding:24px}
.splash img{width:min(64vw,260px);height:auto;border-radius:36px;border:4px solid var(--lar-500);box-shadow:0 10px 0 rgba(0,0,0,.25);animation:flutua 2.6s ease-in-out infinite}
.splash h1{color:var(--creme);font-size:2.3rem}
.splash p{margin:0;font-weight:700;opacity:.92;max-width:300px}
.dots{display:flex;gap:8px;margin-top:6px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--lar-500);animation:pula 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes flutua{50%{transform:translateY(-8px)}}
@keyframes pula{50%{transform:translateY(-8px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Toast e modal */
.toast{position:fixed;width:max-content;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;max-width:min(92vw,520px);background:var(--esm-900);color:#fff;border:3px solid var(--esm-300);border-radius:18px;padding:12px 18px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(15,59,46,.65);display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--branco);border:3px solid var(--tinta);border-radius:24px;padding:20px;max-width:420px;width:100%;box-shadow:0 8px 0 var(--tinta)}
.modal .box h2{margin-bottom:8px}
.modal .box p{margin:0 0 16px;font-weight:700}
.tabs{display:flex;gap:8px;margin:18px 0 4px}
.tab{flex:1;min-height:54px;padding:6px 4px;border:3px solid var(--tinta);border-radius:16px;background:var(--branco);font-weight:800;font-size:.95rem;cursor:pointer}
.tab[aria-selected=true]{background:var(--esm-700);color:#fff;box-shadow:0 4px 0 var(--tinta)}
.pcard .body .linha{margin:0;text-align:center;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.1rem}
.painel{background:var(--branco);border:3px solid var(--tinta);border-radius:22px;box-shadow:0 5px 0 var(--tinta);padding:12px 12px 14px;margin-top:6px}
.grafico svg{display:block;width:100%;height:auto}
.grafico .eixo{stroke:#CBE3D8;stroke-width:1.5}
.grafico .linha{fill:none;stroke:var(--esm-700);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.grafico .pt{fill:var(--lar-500);stroke:var(--tinta);stroke-width:3}
.grafico text{font:700 13px Nunito,sans-serif;fill:var(--tinta2)}
.grafico text.val{fill:var(--tinta);font-size:15px}
.dados.tres{grid-template-columns:repeat(3,1fr);margin-top:8px}
.dados.tres dd{font-size:1rem}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:3px solid var(--tinta);border-radius:18px;background:var(--branco);margin-top:10px}
.item .emj{font-size:1.7rem;line-height:1.2}
.item .inf{flex:1;min-width:0}
.item .nm{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.1rem;line-height:1.2;word-break:break-word}
.item small{display:block;font-weight:700;color:var(--tinta2);font-size:.85rem}
.item .acoes{display:flex;gap:8px;margin-top:8px}
.mini{min-height:44px;padding:0 14px;border:3px solid var(--tinta);border-radius:14px;background:var(--branco);font-weight:800;cursor:pointer}
.item>.mini{align-self:center}
.tag{display:inline-flex;margin-top:6px;border:2px solid var(--tinta);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.82rem;background:var(--creme)}
.tag.ok{background:var(--esm-100)}.tag.logo{background:var(--creme2);border-color:var(--lar-700)}.tag.atraso{background:#FFE3DF;border-color:var(--erro);color:var(--erro)}
.vazio{font-weight:700;color:var(--tinta2);margin:18px 2px}
.box.rolavel{max-height:92vh;overflow-y:auto}
.opts.cores{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.cores .opt{flex-direction:column;min-height:132px;gap:6px;padding:10px 4px;font-size:1rem}
.opts.cores .av.mini{display:block;flex:none;width:88px;height:88px;border-width:4px;padding:0;background:var(--esm-100)}
/* Cartão com personalidade */
body[data-estacao=primavera]{--est-a:#12805C;--est-b:#35A77C}
body[data-estacao=verao]{--est-a:#12805C;--est-b:#1FA08C}
body[data-estacao=outono]{--est-a:#12805C;--est-b:#7B9A3B}
body[data-estacao=inverno]{--est-a:#0F6A74;--est-b:#12805C}
.pcard .head{background:linear-gradient(135deg,var(--est-a,#12805C),var(--est-b,#12805C))}
.pcard.festa .head{background:linear-gradient(135deg,#D9701F,#F59A3B 55%,#12805C)}
.pcard .head .paw{opacity:.28}
.chips.cen{justify-content:center;margin:8px 0 0}
.pcard .head .chip{background:rgba(255,253,248,.92);color:var(--tinta);border-color:var(--tinta)}
.foto-wrap{position:relative;display:inline-block}
.pcard .photo .av{width:148px;height:148px}
.chapeu{position:absolute;top:-22px;right:-6px;font-size:2.2rem;transform:rotate(14deg)}
.av.emo{container-type:size;display:flex;align-items:center;justify-content:center;background:var(--creme2)}
.av.emo span{font-size:55cqw;line-height:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 14px}
.stat{background:var(--creme2);border:3px solid var(--tinta);border-radius:16px;padding:8px 6px;text-align:center}
.stat .big{display:block;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.25rem;line-height:1.2}
.stat small{display:block;font-weight:800;font-size:.72rem;color:var(--tinta2);line-height:1.15}
.selos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
@media (min-width:480px){.selos{grid-template-columns:repeat(4,1fr)}}
.selo{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;min-height:92px;border:3px solid var(--tinta2);border-radius:16px;background:var(--creme);cursor:pointer;opacity:.7}
.selo .se{font-size:1.8rem;line-height:1.1;filter:grayscale(1)}
.selo .st{font-weight:800;font-size:.74rem;line-height:1.15;text-align:center}
.selo.ganho{border-color:var(--tinta);background:var(--branco);opacity:1;box-shadow:0 3px 0 var(--lar-500)}
.selo.ganho .se{filter:none}
.opts.outros{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.outros .opt{flex-direction:column;min-height:78px;gap:2px;font-size:.88rem;padding:6px 2px}
.opts.outros .opt .em{font-size:1.7rem;line-height:1.1}

.box .opts.big.cinco,.box .opts.big.quatro{display:grid}.box .opts.big.cinco{grid-template-columns:repeat(3,1fr)}.box .opts.big.quatro{grid-template-columns:repeat(2,1fr)}
.dias .mini[aria-checked=true]{background:var(--esm-700);color:#fff}
input[type=time]{width:100%;min-height:54px;padding:10px 14px;background:var(--branco);border:3px solid var(--tinta);border-radius:16px;font-weight:700}
.tabs{gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:.82rem;line-height:1.15;padding:6px 2px;min-width:0}
.tab .te{font-size:1.35rem;line-height:1.1}
.prog{height:14px;border:3px solid var(--tinta);border-radius:999px;background:var(--creme);overflow:hidden}
.prog i{display:block;height:100%;background:var(--esm-700);border-radius:999px}
.hojecard{display:block;width:100%;text-align:left;padding:14px;border:3px solid var(--tinta);border-radius:20px;background:var(--branco);box-shadow:0 5px 0 var(--tinta);margin-top:16px;cursor:pointer}
.hojecard .nm,.painel .nm,.avisosbox .nm,.slot .nm{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.1rem;line-height:1.2;display:block}
.hojecard .prog{margin-top:8px}
.slot{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:3px solid var(--tinta);border-radius:18px;background:var(--branco);margin-top:10px;cursor:pointer}
.slot .chk{flex:none;width:44px;height:44px;border:3px solid var(--tinta);border-radius:14px;background:var(--creme);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#fff}
.slot.feito{background:var(--esm-100)}
.slot.feito .chk{background:var(--esm-700)}
.slot.feito .nm{text-decoration:line-through;opacity:.75}
.slot .inf{flex:1;min-width:0}
.slot small{display:block;font-weight:700;color:var(--tinta2);font-size:.85rem}
.avisosbox{margin-top:14px;padding:12px 14px;border:3px dashed var(--tinta2);border-radius:18px}
.avisosbox small{display:block;font-weight:700;color:var(--tinta2);font-size:.85rem;margin-top:2px}
.avisosbox .mini{margin-top:10px}
.hrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.hrow input{flex:1}
.dias{display:flex;gap:6px;flex-wrap:wrap}
.dias .mini{padding:0 10px;min-width:44px}
.dias .mini[aria-pressed=true]{background:var(--esm-700);color:#fff}
.ficha{white-space:pre-wrap;word-break:break-word;font:600 .92rem/1.45 Nunito,sans-serif;background:var(--creme);border:3px solid var(--tinta);border-radius:14px;padding:12px;margin:0;max-height:42vh;overflow:auto}
.folha{display:none}
@media print{body.imprimindo>*:not(.folha){display:none!important}body.imprimindo .folha{display:block;padding:24px;background:#fff}.folha h1{margin-bottom:12px}.folha pre{white-space:pre-wrap;font:14px/1.5 Nunito,Arial,sans-serif}}

.box .opts.big{gap:8px}.box .opts.big .opt{min-width:0;padding:6px 2px;font-size:.9rem}.box .opts.big .opt .em{font-size:1.9rem}
.avisomodal{background:var(--creme2);border:3px solid var(--lar-700);border-radius:14px;padding:10px 14px;font-weight:700;margin:0 0 14px}

.wrap.largo{max-width:820px}
.intro{display:grid;gap:16px;margin-top:12px}
@media (min-width:560px){.intro{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:stretch}.bigimg{height:100%;aspect-ratio:auto;min-height:340px;object-position:center top}.dialog{justify-content:flex-start}.dialog .chamada{margin-top:auto}}
.bigimg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border:3px solid var(--tinta);border-radius:26px;box-shadow:0 6px 0 var(--tinta);background:var(--esm-900)}
.dialog{display:flex;flex-direction:column;gap:12px;background:var(--branco);border:3px solid var(--tinta);border-radius:22px;padding:18px 20px;box-shadow:0 5px 0 var(--tinta);font-weight:700}
.dialog p{margin:0}
.dialog .saud{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:1.3rem;line-height:1.2;color:var(--esm-700)}
.dialog .nome{display:inline-block;background:var(--esm-300);color:var(--tinta);border-radius:10px;padding:0 8px;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800}
.dialog .fim{color:var(--tinta2)}
.chamada{margin-top:6px;background:var(--creme2);border:3px solid var(--lar-700);border-radius:16px;padding:10px 14px;font-weight:800;color:var(--tinta)}
.destaque{background:var(--lar-500);color:var(--tinta);border-radius:8px;padding:0 6px;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;white-space:nowrap}
.skinimg{width:44px;height:44px;border-radius:12px;border:2px solid var(--tinta);object-fit:cover}
.opt{padding:6px 8px}
.opts.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.opts.skins .opt{flex-direction:column;gap:6px;min-height:104px;padding:8px 4px;font-size:.85rem;text-align:center;line-height:1.15}
.opts.skins .skinimg{width:56px;height:56px}
.opts.skins.rola{max-height:340px;overflow-y:auto;padding:2px 4px 8px;overscroll-behavior:contain}
.catchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}

    campo("f-peso", "Peso em kg (opcional)", inPeso, d.especie === "outro" ? "Bichinhos pequenos: 0,25 equivale a 250 gramas." : "Exemplo: 4,5"),
    h("h2", { class: "sec-title" }, "📷 Foto"), fotoBox, file,
    h("h2", { class: "sec-title" }, "🩺 Convênio (opcional)"),
    campo("f-cn", "Nome do convênio ou plano", inConvN),
    campo("f-cc", "Número da carteirinha", inConvC),
    h("div", { class: "stack", style: "margin-top:10px" },
      h("button", { class: "btn verde", type: "submit" }, "💚 Salvar cadastro"),
      h("button", { class: "btn sec", type: "button", onclick: function () { go(novo ? "picker" : "card"); } }, "Cancelar")));
  return h("div", null,
    topbar(novo ? "Novo amiguinho" : "Editar cadastro", btnVoltar(function () { go(novo ? "picker" : "card"); })),
    h("main", { class: "wrap" }, form));
}

function lerFoto(f) {
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var L = 320, c = document.createElement("canvas"); c.width = c.height = L;
      var s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, L, L);
      st.draft.foto = c.toDataURL("image/jpeg", 0.8); render();
    };
    img.onerror = function () { st.msg = { tom: "oops", texto: "Ops, não consegui abrir essa foto. Vamos tentar outra pelo nosso amiguinho?" }; render(); };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}

function erro(campo, texto, id) {
  st.msg = { tom: "oops", texto: texto, campo: campo }; render();
  var el = document.getElementById(id); if (el) el.focus();
  window.scrollTo(0, 0);
}
function salvar() {
  var d = st.draft, nome = (d.nome || "").trim();
  if (!d.especie) return erro("esp", "Ops, acho que não é assim 🐾 Vamos escolher se é cachorro ou gato?", "lb-esp");
  if (!nome) return erro("nome", "Ops, acho que não é assim 🐾 Qual é o nome do nosso amiguinho?", "f-nome");
  var nasc = parseISO(d.nasc);
  if (!nasc) return erro("nasc", "Ops, falta a data de nascimento! Se não souber, uma data aproximada já ajuda.", "f-nasc");
  if (nasc > new Date()) return erro("nasc", "Ops, essa data ainda não chegou! Vamos conferir o nascimento do nosso amiguinho?", "f-nasc");
  if (new Date().getFullYear() - nasc.getFullYear() > 40) return erro("nasc", "Ops, essa data está muito antiga. Vamos conferir o ano pelo nosso amiguinho?", "f-nasc");
  var peso = null;
  if (d.peso != null && String(d.peso).trim() !== "") {
    peso = parseFloat(String(d.peso).replace(",", "."));
    var e = ESPECIES[d.especie];
    if (!isFinite(peso) || peso <= 0 || peso > e.hard) return erro("peso", "Ops, esse peso não parece certo. Vamos conferir na balança, pelo nosso amiguinho?", "f-peso");
    if ((peso < e.min || peso > e.max) && !st.confirmPeso) {
      st.confirmPeso = true;
      return erro("peso", "Hmm, esse peso me parece fora do comum para " + (d.especie === "gato" ? "um gato" : "um cachorro") + ". Vamos conferir? Se estiver certo, é só salvar de novo.", "f-peso");
    }
  }
  var existente = d.id ? petAtual() : null;
  var pesos = (existente && existente.pesos) || [];
  var ant = existente ? existente.peso : null;
  if (peso != null && peso !== ant) pesos = pesos.concat([{ d: hojeISO(), kg: peso }]);
  var pet = {
    id: d.id || uid(), nome: nome, especie: d.especie, sexo: d.sexo || "", raca: (d.raca || "").trim(),
    nasc: d.nasc, aprox: !!d.aprox, peso: peso, pesos: pesos, saude: (existente && existente.saude) || [], rotina: (existente && existente.rotina) || [], melhorSeq: (existente && existente.melhorSeq) || 0, cor: (PALETAS[d.especie] || []).some(function (c) { return c.id === d.cor; }) ? d.cor : "", emoji: d.especie === "outro" ? ((OUTROS.filter(function (o) { return o.em === d.emoji; })[0] || {}).em || "") : "", avulsos: (existente && existente.avulsos) || [], feitos: (existente && existente.feitos) || {}, foto: d.foto || "",
    convenio: { nome: (d.convenio.nome || "").trim(), numero: (d.convenio.numero || "").trim() },
    criado: (existente && existente.criado) || Date.now(), editado: Date.now()
  };
  if (existente) st.pets = st.pets.map(function (x) { return x.id === pet.id ? pet : x; });
  else st.pets = st.pets.concat([pet]);
  persist();
  toast("Ae que fofo! Os dados de " + nome + " parecem coerentes. Cadastro salvo! 💚");
  go("card", { petId: pet.id });
}

/* ─── Render ─── */
function render() {
  document.body.setAttribute("data-estacao", estacao(new Date()).id);
  var v = st.screen === "splash" ? vSplash() : st.screen === "intro" ? vIntro() : st.screen === "picker" ? vPicker() : st.screen === "card" ? vCard() : vForm();
  $app.replaceChildren(v);
}

/* ─── Início ─── */
async function start() {
  try { if (localStorage.getItem("spt_texto") === "grande") document.documentElement.classList.add("grande"); } catch (e) {}
  aplicarManifesto(MANIFESTO);
  var pm = carregarManifesto();
  render();
  var t0 = Date.now();
  try {
    if (!S) throw new Error("núcleo indisponível");
    var u = await S.init("spt", { home: "index.html" });
    if (!u) return;                               // sem login: o núcleo leva de volta ao SYS
    st.user = S.user(); st.uid = st.user.uid;
  } catch (e) {
    console.warn("[SPT] modo local:", e); st.local = true; st.uid = "local";
  }
  await pm;
  loadLocal(); writeSummary();
  await sleep(Math.max(0, 1100 - (Date.now() - t0)));
  go(st.intro || st.pets.length ? "picker" : "intro");
  pull().then(function () {
    if (st.screen === "intro" && (st.intro || st.pets.length)) go("picker");
    else if (st.screen === "picker" || st.screen === "card" || st.screen === "intro") render();
  });
}
window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
start();
})();
</script>
</body>
