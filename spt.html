<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B4D3A">
<title>Sheyla Pet</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="core/sheyla-core.js?v=4"></script>
<style>
:root{
  --esm-900:#0B4D3A; --esm-700:#12805C; --esm-300:#6EE7B7; --esm-100:#CFF5E4;
  --lar-500:#F59A3B; --lar-700:#D9701F;
  --creme:#FFF3E0; --creme2:#FFE7C2; --branco:#FFFDF8;
  --tinta:#0F3B2E; --tinta2:#3C6B5A; --erro:#B3261E;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.grande{font-size:20px}
body{margin:0;min-height:100vh;background:var(--creme);color:var(--tinta);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;line-height:1.45;
  background-image:radial-gradient(circle at 1px 1px,rgba(15,59,46,.07) 1.5px,transparent 0);background-size:22px 22px}
h1,h2,h3{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;margin:0;line-height:1.15;color:var(--esm-900)}
h1{font-size:1.7rem} h2{font-size:1.3rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--esm-900);outline-offset:3px;box-shadow:0 0 0 3px #fff}
.topbar{position:sticky;top:0;z-index:5;background:var(--esm-900);color:var(--creme);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:60px;border-bottom:4px solid var(--lar-500)}
.topbar .t{flex:1;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.2rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:2px solid rgba(255,243,224,.5);color:var(--creme);border-radius:14px;padding:0 12px;font-weight:800;text-decoration:none;cursor:pointer}
.tbtn:hover{background:rgba(255,243,224,.12)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 56px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:10px 18px;border:3px solid var(--tinta);border-radius:18px;background:var(--lar-500);color:var(--tinta);font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--tinta);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.btn.verde{background:var(--esm-700);color:#fff}
.btn.sec{background:var(--branco)}
.btn.perigo{background:#FFE3DF;color:var(--erro);border-color:var(--erro);box-shadow:0 4px 0 var(--erro)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.row{display:flex;gap:12px}.row>*{flex:1}
.stack>*+*{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--branco);border:2px solid var(--tinta);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem}
.chip.aviso{background:var(--creme2)}
/* Balão da Sheyla */
.bubble{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.bubble .face{flex:none;width:64px;height:64px;border-radius:16px;border:3px solid var(--tinta);overflow:hidden;background:var(--esm-700)}
.bubble .face img{width:100%;height:100%;display:block}
.bubble .txt{position:relative;background:var(--branco);border:3px solid var(--tinta);border-radius:6px 20px 20px 20px;padding:10px 14px;font-weight:700;box-shadow:0 4px 0 var(--tinta)}
.bubble.oops .txt{background:var(--creme2);border-color:var(--lar-700);box-shadow:0 4px 0 var(--lar-700)}
.bubble.ok .txt{background:var(--esm-100);border-color:var(--esm-700);box-shadow:0 4px 0 var(--esm-700)}
.bubble .who{display:block;font-size:.72rem;font-weight:800;letter-spacing:.5px;color:var(--tinta2);text-transform:uppercase;margin-bottom:2px}
/* Avatar */
.av{border-radius:50%;overflow:hidden;border:4px solid var(--lar-500);background:var(--esm-100);flex:none}
.av img,.av svg{width:100%;height:100%;display:block;object-fit:cover}
/* Seleção de pets */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 14px;background:var(--branco);border:3px solid var(--tinta);border-radius:24px;box-shadow:0 5px 0 var(--tinta);cursor:pointer;font-weight:800;min-height:190px;justify-content:flex-start;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
.tile .av{width:112px;height:112px}
.tile .nm{font-family:"Baloo 2",sans-serif;font-size:1.25rem;line-height:1.1;text-align:center;word-break:break-word}
.tile .sub{font-size:.8rem;color:var(--tinta2);font-weight:700;margin-top:-6px}
.tile.novo{background:transparent;border-style:dashed;box-shadow:none;color:var(--esm-900)}
.tile.novo .mais{width:112px;height:112px;border-radius:50%;border:4px dashed var(--esm-700);display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--esm-700);background:var(--esm-100)}
/* Formulário */
label,.lbl{display:block;font-weight:800;margin:0 0 6px}
.hint{font-size:.82rem;color:var(--tinta2);font-weight:700;margin-top:4px}
input[type=text],input[type=number],input[type=date]{width:100%;min-height:54px;padding:10px 14px;background:var(--branco);border:3px solid var(--tinta);border-radius:16px;font-weight:700}
input[aria-invalid=true]{border-color:var(--erro);background:#FFF1EF}
.opts{display:flex;gap:10px}
.opt{flex:1;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--tinta);border-radius:16px;background:var(--branco);font-weight:800;cursor:pointer}
.opt[aria-checked=true]{background:var(--esm-700);color:#fff;box-shadow:0 4px 0 var(--tinta)}
.opts.big .opt{flex-direction:column;min-height:96px;font-size:1.05rem}
.opts.big .opt .em{font-size:2.2rem;line-height:1}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:700;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--esm-700);flex:none}
.sec-title{margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.foto{display:flex;align-items:center;gap:16px}
.foto .av{width:96px;height:96px}
/* Cartão do pet */
.pcard{background:var(--branco);border:3px solid var(--tinta);border-radius:26px;box-shadow:0 6px 0 var(--tinta);overflow:hidden}
.pcard .head{background:var(--esm-700);padding:22px 16px 56px;text-align:center;color:#fff;position:relative}
.pcard .head h1{color:#fff;font-size:1.9rem}
.pcard .head .esp{font-weight:800;opacity:.95}
.pcard .head .paw{position:absolute;font-size:2rem;opacity:.18;transform:rotate(-18deg)}
.pcard .photo{display:flex;justify-content:center;margin-top:-48px;position:relative;z-index:1}
.pcard .photo .av{width:136px;height:136px;border-width:5px;border-color:var(--lar-500);background:#fff}
.pcard .body{padding:14px 18px 20px}
.dados{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0}
.dados div{background:var(--creme);border:2px solid var(--tinta);border-radius:14px;padding:8px 12px}
.dados dt{font-size:.72rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--tinta2)}
.dados dd{margin:2px 0 0;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.15rem;line-height:1.2;word-break:break-word}
.dados .full{grid-column:1/-1}
.soon{display:grid;gap:10px;margin-top:8px}
.soon div{display:flex;align-items:center;gap:12px;padding:12px 14px;border:3px dashed var(--tinta2);border-radius:18px;color:var(--tinta2);font-weight:800}
.soon small{margin-left:auto;font-size:.7rem;letter-spacing:.5px;text-transform:uppercase;background:var(--creme2);border-radius:999px;padding:2px 10px;color:var(--tinta)}
/* Abertura */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:radial-gradient(circle at 50% 38%,var(--esm-700),var(--esm-900) 72%);color:var(--creme);padding:24px}
.splash img{width:min(64vw,260px);height:auto;border-radius:36px;border:4px solid var(--lar-500);box-shadow:0 10px 0 rgba(0,0,0,.25);animation:flutua 2.6s ease-in-out infinite}
.splash h1{color:var(--creme);font-size:2.3rem}
.splash p{margin:0;font-weight:700;opacity:.92;max-width:300px}
.dots{display:flex;gap:8px;margin-top:6px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--lar-500);animation:pula 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes flutua{50%{transform:translateY(-8px)}}
@keyframes pula{50%{transform:translateY(-8px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Toast e modal */
.toast{position:fixed;width:max-content;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;max-width:min(92vw,520px);background:var(--esm-900);color:#fff;border:3px solid var(--esm-300);border-radius:18px;padding:12px 18px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(15,59,46,.65);display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--branco);border:3px solid var(--tinta);border-radius:24px;padding:20px;max-width:420px;width:100%;box-shadow:0 8px 0 var(--tinta)}
.modal .box h2{margin-bottom:8px}
.modal .box p{margin:0 0 16px;font-weight:700}
.skinimg{width:44px;height:44px;border-radius:12px;border:2px solid var(--tinta);object-fit:cover}
.opt{padding:6px 8px}
.opts.skins .opt{flex-direction:column;gap:6px;min-height:104px;padding:8px 4px;font-size:.85rem;text-align:center;line-height:1.15}
.opts.skins .skinimg{width:56px;height:56px}
.small{font-size:.8rem;color:var(--tinta2);font-weight:700;text-align:center;margin-top:18px}
</style>
</head>

  var y = n.getFullYear() - b.getFullYear(), m = n.getMonth() - b.getMonth(), d = n.getDate() - b.getDate();
  if (d < 0) m--;
  if (m < 0) { y--; m += 12; }
  if (y >= 1) return y + (y > 1 ? " anos" : " ano") + (m ? " e " + m + (m > 1 ? " meses" : " mês") : "");
  if (m >= 1) return m + (m > 1 ? " meses" : " mês");
  var dias = Math.floor((n - b) / 864e5);
  if (dias >= 7) { var s = Math.floor(dias / 7); return s + (s > 1 ? " semanas" : " semana"); }
  return dias <= 0 ? "nasceu hoje" : dias + (dias > 1 ? " dias" : " dia");
}
function estacao(d) {
  var v = (d.getMonth() + 1) * 100 + d.getDate();   // hemisfério sul
  if (v >= 1221 || v <= 319) return { id: "verao", nome: "verão", emoji: "☀️" };
  if (v <= 620) return { id: "outono", nome: "outono", emoji: "🍂" };
  if (v <= 922) return { id: "inverno", nome: "inverno", emoji: "❄️" };
  return { id: "primavera", nome: "primavera", emoji: "🌸" };
}
function rotuloEsp(p) { var e = ESPECIES[p.especie] || ESPECIES.cachorro; return p.sexo === "f" ? e.f : e.m; }
function fmtPeso(kg) { return kg ? String(kg).replace(".", ",") + " kg" : "—"; }

/* ─── Armazenamento (local por usuário + nuvem pelo núcleo) ─── */
function lsKey() { return "spt_v1_" + st.uid; }
function perfil() { return PERFIS[st.skin] || PERFIS.laranja; }
function setSkin(id) {
  st.skin = id; try { localStorage.setItem("spt_skin_" + st.uid, id); } catch (e) {}
  if (S && !st.local && st.user) S.save({ skin: id }).catch(function (e) { console.warn("[SPT] skin", e); });
  render();
}
function loadLocal() {
  try { var sk = localStorage.getItem("spt_skin_" + st.uid); if (sk && PERFIS[sk]) st.skin = sk; } catch (e) {}
  try { var o = JSON.parse(localStorage.getItem(lsKey()) || "null"); if (o && Array.isArray(o.pets)) { st.pets = o.pets; st.at = o.at || 0; } } catch (e) {}
}
function saveLocal() { try { localStorage.setItem(lsKey(), JSON.stringify({ pets: st.pets, at: st.at })); } catch (e) {} }

function resumo() {
  var n = st.pets.length;
  if (!n) return { headline: "Nenhum amiguinho ainda", lines: ["Cadastre o primeiro 🐾"] };
  return {
    headline: n + (n > 1 ? " amiguinhos" : " amiguinho"),
    lines: st.pets.slice(0, 3).map(function (p) { return (ESPECIES[p.especie] || ESPECIES.cachorro).emoji + " " + p.nome + " · " + idade(p.nasc); })
  };
}
function writeSummary() {
  var r = resumo();
  if (S && !st.local) { try { S.summary(r); return; } catch (e) {} }
  try { localStorage.setItem("spt_summary", JSON.stringify(Object.assign({}, r, { updatedAt: Date.now() }))); } catch (e) {}
}
var pushT = null;
function persist() { st.at = Date.now(); saveLocal(); writeSummary(); clearTimeout(pushT); pushT = setTimeout(push, 400); }
function push() {
  if (!S || st.local || !st.user) return Promise.resolve();
  return S.save({ pets: JSON.stringify(st.pets), petsAt: st.at }).catch(function (e) { console.warn("[SPT] push", e); });
}
function pull() {
  if (!S || st.local || !st.user) return Promise.resolve();
  return S.load().then(function (d) {
    if (d && d.skin && PERFIS[d.skin] && d.skin !== st.skin) { st.skin = d.skin; try { localStorage.setItem("spt_skin_" + st.uid, d.skin); } catch (e) {} }
    if (d && d.pets) {
      var nuvem = d.petsAt || 0;
      if (nuvem > st.at) { st.pets = JSON.parse(d.pets); st.at = nuvem; saveLocal(); writeSummary(); }
      else if (st.at > nuvem) push();
    } else if (st.pets.length) push();
  }).catch(function (e) { console.warn("[SPT] pull", e); });
}

/* ─── Peças de interface ─── */
function avatar(p, size) {
  var box = h("div", { class: "av", style: size ? "width:" + size + "px;height:" + size + "px" : null });
  if (p && p.foto) box.appendChild(h("img", { src: p.foto, alt: "Foto de " + p.nome }));
  else box.innerHTML = (p && p.especie === "gato") ? SVG_GATO : SVG_CAO;   // SVG estático, sem dado do usuário
  return box;
}
function bubble(texto, tom) {
  return h("div", { class: "bubble " + (tom || ""), role: tom === "oops" ? "alert" : null },
    h("div", { class: "face" }, h("img", { src: perfil(), alt: "" })),
    h("div", { class: "txt" }, h("span", { class: "who" }, "Sheyla Pet"), texto));
}
function topbar(titulo, esq) {
  return h("div", { class: "topbar" },
    esq,
    h("div", { class: "t" }, titulo),
    h("button", { class: "tbtn", type: "button", "aria-label": "Alternar tamanho do texto", "aria-pressed": document.documentElement.classList.contains("grande") ? "true" : "false", onclick: toggleTexto }, "A+"));
}
function linkHub() { return h("a", { class: "tbtn", href: "index.html", "aria-label": "Voltar ao SYS" }, "← SYS"); }
function btnVoltar(fn, rot) { return h("button", { class: "tbtn", type: "button", onclick: fn, "aria-label": rot || "Voltar" }, "← Voltar"); }
function toggleTexto() {
  var g = document.documentElement.classList.toggle("grande");
  try { localStorage.setItem("spt_texto", g ? "grande" : "normal"); } catch (e) {}
  render();
}
function toast(t) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var el = h("div", { class: "toast", role: "status" }, t); document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 4200);
}

/* ─── Navegação ─── */
function go(screen, extra) {
  st.screen = screen; st.msg = null;
  if (extra) Object.keys(extra).forEach(function (k) { st[k] = extra[k]; });
  render(); window.scrollTo(0, 0);
}
function petAtual() { return st.pets.filter(function (p) { return p.id === st.petId; })[0] || null; }

/* ─── Telas ─── */
function vSplash() {
  return h("div", { class: "splash" },
    h("img", { src: LOGO, alt: "Logo da Sheyla Pet" }),
    h("h1", null, "Sheyla Pet"),
    h("p", null, "Preparando tudo para o seu amiguinho…"),
    h("div", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")));
}

function vPicker() {
  var hoje = new Date(), est = estacao(hoje);
  var primeiro = st.user && st.user.name ? String(st.user.name).split(" ")[0] : "";
  var dia = hoje.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  var vazio = !st.pets.length;
  var grid = h("div", { class: "grid" });
  st.pets.forEach(function (p) {
    grid.appendChild(h("button", { class: "tile", type: "button", onclick: function () { go("card", { petId: p.id }); }, "aria-label": "Abrir " + p.nome },
      avatar(p), h("span", { class: "nm" }, p.nome), h("span", { class: "sub" }, rotuloEsp(p) + " · " + idade(p.nasc))));
  });
  if (st.pets.length < 12) {
    grid.appendChild(h("button", { class: "tile novo", type: "button", onclick: function () { abrirForm(null); }, "aria-label": "Cadastrar novo amiguinho" },
      h("span", { class: "mais", "aria-hidden": "true" }, "+"), h("span", { class: "nm" }, "Novo amiguinho")));
  }
  return h("div", null,
    topbar("Sheyla Pet", linkHub()),
    h("main", { class: "wrap" },
      h("div", { class: "chips" },
        h("span", { class: "chip" }, "📅 " + dia),
        h("span", { class: "chip" }, est.emoji + " " + est.nome),
        st.local ? h("span", { class: "chip aviso" }, "modo local · sem login") : null),
      bubble(vazio
        ? "Oi" + (primeiro ? ", " + primeiro : "") + "! Eu sou a Sheyla Pet 🐾 Vamos cadastrar o seu primeiro amiguinho?"
        : "Oi" + (primeiro ? ", " + primeiro : "") + "! Que bom te ver por aqui 🐾"),
      h("h1", null, vazio ? "Quem vamos conhecer hoje?" : "Que amiguinho vamos cuidar hoje?"),
      grid,
      h("h2", { class: "sec-title" }, "Quem está com a Sheyla?"),
      h("div", { class: "opts skins", role: "radiogroup", "aria-label": "Bichinho que a Sheyla segura" }, SKINS.map(function (k) {
        return h("button", { class: "opt", type: "button", role: "radio", "aria-checked": st.skin === k.id ? "true" : "false", onclick: function () { setSkin(k.id); toast(k.msg); } },
          h("img", { class: "skinimg", src: PERFIS[k.id], alt: "" }), k.nome);
      })),
      h("p", { class: "small" }, "Os dados ficam só na sua conta Google.")));
}

function vCard() {
  var p = petAtual(); if (!p) { go("picker"); return h("div"); }
  var e = ESPECIES[p.especie] || ESPECIES.cachorro;
  var conv = p.convenio && (p.convenio.nome || p.convenio.numero) ? [p.convenio.nome, p.convenio.numero].filter(Boolean).join(" · ") : "Sem convênio";
  return h("div", null,
    topbar("Cartão do pet", btnVoltar(function () { go("picker"); }, "Voltar para a escolha do amiguinho")),
    h("main", { class: "wrap" },
      h("div", { class: "pcard" },
        h("div", { class: "head" },
          h("span", { class: "paw", style: "left:14px;top:10px", "aria-hidden": "true" }, "🐾"),
          h("span", { class: "paw", style: "right:16px;top:30px;transform:rotate(14deg)", "aria-hidden": "true" }, "🐾"),
          h("h1", null, p.nome),
          h("div", { class: "esp" }, e.emoji + " " + rotuloEsp(p) + (p.raca ? " · " + p.raca : ""))),
        h("div", { class: "photo" }, avatar(p)),
        h("div", { class: "body" },
          h("dl", { class: "dados" },
            dado("Idade", idade(p.nasc)),
            dado("Peso", fmtPeso(p.peso)),
            dado("Nascimento", fmtData(p.nasc) + (p.aprox ? " (aprox.)" : "")),
            dado("Sexo", p.sexo === "f" ? "Fêmea" : p.sexo === "m" ? "Macho" : "Não informado"),
            dado("Convênio", conv, true)))),
      h("h2", { class: "sec-title" }, "Em breve por aqui"),
      h("div", { class: "soon" },
        soon("✅", "Tarefas do dia"), soon("💊", "Remédios e lembretes"), soon("🗂️", "Arquivo de fotos e exames")),
      h("div", { class: "stack", style: "margin-top:24px" },
        h("button", { class: "btn verde", type: "button", onclick: function () { abrirForm(p); } }, "✏️ Editar cadastro"),
        h("button", { class: "btn sec", type: "button", onclick: function () { go("picker"); } }, "🐾 Trocar de amiguinho"),
        h("button", { class: "btn perigo", type: "button", onclick: function () { modalRemover(p); } }, "Remover amiguinho"))));
}
function dado(l, v, full) { return h("div", { class: full ? "full" : null }, h("dt", null, l), h("dd", null, v)); }
function soon(i, t) { return h("div", null, h("span", { "aria-hidden": "true" }, i), t, h("small", null, "em breve")); }

function modalRemover(p) {
  var m = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "mt" },
    h("div", { class: "box" },
      h("h2", { id: "mt" }, "Remover " + p.nome + "?"),
      h("p", null, "O cadastro e a foto serão apagados da sua conta. Essa ação não dá para desfazer."),
      h("div", { class: "stack" },
        h("button", { class: "btn perigo", type: "button", onclick: function () {
          st.pets = st.pets.filter(function (x) { return x.id !== p.id; }); persist(); m.remove(); toast("Cadastro de " + p.nome + " removido."); go("picker");
        } }, "Sim, remover"),
        h("button", { class: "btn sec", type: "button", onclick: function () { m.remove(); } }, "Não, voltar"))));
  document.body.appendChild(m);
  m.querySelector(".btn.sec").focus();
}

/* ─── Formulário ─── */
function abrirForm(p) {
  st.confirmPeso = false;
  st.draft = p ? JSON.parse(JSON.stringify(p)) : { id: null, nome: "", especie: "", sexo: "", raca: "", nasc: "", aprox: false, peso: "", pesos: [], foto: "", convenio: { nome: "", numero: "" } };
  if (!st.draft.convenio) st.draft.convenio = { nome: "", numero: "" };
  go("form");
}
function setOpts(grupo, valores, atual, onSet, big, rotulo) {
  var box = h("div", { class: "opts" + (big ? " big" : ""), role: "radiogroup", "aria-label": rotulo });
  valores.forEach(function (v) {
    box.appendChild(h("button", { class: "opt", type: "button", role: "radio", "aria-checked": atual === v.v ? "true" : "false", onclick: function () { onSet(v.v); render(); } },
      v.em ? h("span", { class: "em", "aria-hidden": "true" }, v.em) : null, v.t));
  });
  return box;
}
function campo(id, rotulo, input, dica) {
  return h("div", null, h("label", { for: id }, rotulo), input, dica ? h("div", { class: "hint", id: id + "-h" }, dica) : null);
}
function vForm() {
  var d = st.draft, novo = !d.id, msg = st.msg;
  var inNome = h("input", { id: "f-nome", type: "text", maxlength: "40", autocomplete: "off", value: d.nome, "aria-invalid": msg && msg.campo === "nome" ? "true" : null, oninput: function (e) { d.nome = e.target.value; } });
  var inRaca = h("input", { id: "f-raca", type: "text", maxlength: "40", autocomplete: "off", value: d.raca, oninput: function (e) { d.raca = e.target.value; } });
  var inNasc = h("input", { id: "f-nasc", type: "date", max: hojeISO(), value: d.nasc, "aria-invalid": msg && msg.campo === "nasc" ? "true" : null, oninput: function (e) { d.nasc = e.target.value; } });
  var inPeso = h("input", { id: "f-peso", type: "number", inputmode: "decimal", step: "0.01", min: "0", value: d.peso, "aria-invalid": msg && msg.campo === "peso" ? "true" : null, oninput: function (e) { d.peso = e.target.value; st.confirmPeso = false; } });
  var inConvN = h("input", { id: "f-cn", type: "text", maxlength: "40", autocomplete: "off", value: d.convenio.nome, oninput: function (e) { d.convenio.nome = e.target.value; } });
  var inConvC = h("input", { id: "f-cc", type: "text", maxlength: "40", autocomplete: "off", value: d.convenio.numero, oninput: function (e) { d.convenio.numero = e.target.value; } });
  var file = h("input", { type: "file", accept: "image/*", style: "display:none", id: "f-file", onchange: function (e) { lerFoto(e.target.files && e.target.files[0]); } });
  var fotoBox = h("div", { class: "foto" }, avatar(d.foto ? d : { especie: d.especie }, 96),
    h("div", { class: "stack", style: "flex:1" },
      h("button", { class: "btn sec", type: "button", onclick: function () { file.click(); } }, "📷 " + (d.foto ? "Trocar foto" : "Adicionar foto")),
      d.foto ? h("button", { class: "btn sec", type: "button", onclick: function () { d.foto = ""; render(); } }, "Tirar foto") : null));
  var form = h("form", { class: "stack", novalidate: "novalidate", onsubmit: function (e) { e.preventDefault(); salvar(); } },
    msg ? bubble(msg.texto, msg.tom) : bubble(novo ? "Vamos fazer o cadastro? Só preciso do básico, o resto você completa quando quiser." : "Vamos atualizar os dados com carinho?"),
    h("div", null, h("div", { class: "lbl", id: "lb-esp" }, "Quem é o amiguinho?"),
      setOpts("esp", [{ v: "cachorro", t: "Cachorro", em: "🐶" }, { v: "gato", t: "Gato", em: "🐱" }], d.especie, function (v) { d.especie = v; st.confirmPeso = false; }, true, "Espécie")),
    campo("f-nome", "Nome", inNome),
    h("div", null, h("div", { class: "lbl" }, "Sexo"),
      setOpts("sexo", [{ v: "m", t: "Macho" }, { v: "f", t: "Fêmea" }, { v: "", t: "Não sei" }], d.sexo, function (v) { d.sexo = v; }, false, "Sexo")),
    campo("f-raca", "Raça (opcional)", inRaca, "Sem raça definida? Pode escrever “SRD”."),
    campo("f-nasc", "Data de nascimento", inNasc),
    h("label", { class: "check" }, h("input", { type: "checkbox", checked: d.aprox ? "checked" : null, onchange: function (e) { d.aprox = e.target.checked; } }), "Não tenho certeza, a data é aproximada"),
    campo("f-peso", "Peso em kg (opcional)", inPeso, "Exemplo: 4,5"),
    h("h2", { class: "sec-title" }, "📷 Foto"), fotoBox, file,
    h("h2", { class: "sec-title" }, "🩺 Convênio (opcional)"),
    campo("f-cn", "Nome do convênio ou plano", inConvN),
    campo("f-cc", "Número da carteirinha", inConvC),
    h("div", { class: "stack", style: "margin-top:10px" },
      h("button", { class: "btn verde", type: "submit" }, "💚 Salvar cadastro"),
      h("button", { class: "btn sec", type: "button", onclick: function () { go(novo ? "picker" : "card"); } }, "Cancelar")));
  return h("div", null,
    topbar(novo ? "Novo amiguinho" : "Editar cadastro", btnVoltar(function () { go(novo ? "picker" : "card"); })),
    h("main", { class: "wrap" }, form));
}

function lerFoto(f) {
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var L = 320, c = document.createElement("canvas"); c.width = c.height = L;
      var s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, L, L);
      st.draft.foto = c.toDataURL("image/jpeg", 0.8); render();
    };
    img.onerror = function () { st.msg = { tom: "oops", texto: "Ops, não consegui abrir essa foto. Vamos tentar outra pelo nosso amiguinho?" }; render(); };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}

function erro(campo, texto, id) {
  st.msg = { tom: "oops", texto: texto, campo: campo }; render();
  var el = document.getElementById(id); if (el) el.focus();
  window.scrollTo(0, 0);
}
function salvar() {
  var d = st.draft, nome = (d.nome || "").trim();
  if (!d.especie) return erro("esp", "Ops, acho que não é assim 🐾 Vamos escolher se é cachorro ou gato?", "lb-esp");
  if (!nome) return erro("nome", "Ops, acho que não é assim 🐾 Qual é o nome do nosso amiguinho?", "f-nome");
  var nasc = parseISO(d.nasc);
  if (!nasc) return erro("nasc", "Ops, falta a data de nascimento! Se não souber, uma data aproximada já ajuda.", "f-nasc");
  if (nasc > new Date()) return erro("nasc", "Ops, essa data ainda não chegou! Vamos conferir o nascimento do nosso amiguinho?", "f-nasc");
  if (new Date().getFullYear() - nasc.getFullYear() > 40) return erro("nasc", "Ops, essa data está muito antiga. Vamos conferir o ano pelo nosso amiguinho?", "f-nasc");
  var peso = null;
  if (String(d.peso).trim() !== "") {
    peso = parseFloat(String(d.peso).replace(",", "."));
    var e = ESPECIES[d.especie];
    if (!isFinite(peso) || peso <= 0 || peso > 150) return erro("peso", "Ops, esse peso não parece certo. Vamos conferir na balança, pelo nosso amiguinho?", "f-peso");
    if ((peso < e.min || peso > e.max) && !st.confirmPeso) {
      st.confirmPeso = true;
      return erro("peso", "Hmm, esse peso me parece fora do comum para " + (d.especie === "gato" ? "um gato" : "um cachorro") + ". Vamos conferir? Se estiver certo, é só salvar de novo.", "f-peso");
    }
  }
  var existente = d.id ? petAtual() : null;
  var pesos = (existente && existente.pesos) || [];
  var ant = existente ? existente.peso : null;
  if (peso != null && peso !== ant) pesos = pesos.concat([{ d: hojeISO(), kg: peso }]);
  var pet = {
    id: d.id || uid(), nome: nome, especie: d.especie, sexo: d.sexo || "", raca: (d.raca || "").trim(),
    nasc: d.nasc, aprox: !!d.aprox, peso: peso, pesos: pesos, foto: d.foto || "",
    convenio: { nome: (d.convenio.nome || "").trim(), numero: (d.convenio.numero || "").trim() },
    criado: (existente && existente.criado) || Date.now(), editado: Date.now()
  };
  if (existente) st.pets = st.pets.map(function (x) { return x.id === pet.id ? pet : x; });
  else st.pets = st.pets.concat([pet]);
  persist();
  toast("Ae que fofo! Os dados de " + nome + " parecem coerentes. Cadastro salvo! 💚");
  go("card", { petId: pet.id });
}

/* ─── Render ─── */
function render() {
  document.body.setAttribute("data-estacao", estacao(new Date()).id);
  var v = st.screen === "splash" ? vSplash() : st.screen === "picker" ? vPicker() : st.screen === "card" ? vCard() : vForm();
  $app.replaceChildren(v);
}

/* ─── Início ─── */
async function start() {
  try { if (localStorage.getItem("spt_texto") === "grande") document.documentElement.classList.add("grande"); } catch (e) {}
  render();
  var t0 = Date.now();
  try {
    if (!S) throw new Error("núcleo indisponível");
    var u = await S.init("spt", { home: "index.html" });
    if (!u) return;                               // sem login: o núcleo leva de volta ao SYS
    st.user = S.user(); st.uid = st.user.uid;
  } catch (e) {
    console.warn("[SPT] modo local:", e); st.local = true; st.uid = "local";
  }
  loadLocal(); writeSummary();
  await sleep(Math.max(0, 1100 - (Date.now() - t0)));
  go("picker");
  pull().then(function () { if (st.screen === "picker" || st.screen === "card") render(); });
}
window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
start();
})();
</script>
