// ══════════════════════════════════════════════════════
// ── Firebase Auth + Sync ──
// ══════════════════════════════════════════════════════
const _fb = window._sdcFirebase || null;
const SYS_UID_KEY = "sdc_sys_uid";

function _stripMeta(d) {
  if (!d) return d;
  const o = { ...d };
  delete o._savedAt; delete o._serverAt;
  return o;
}

async function saveToCloud(uid, data) {
  if (!_fb || !uid) return;
  try {
    await window._sheyla.save({ ...data, _updatedAt: Date.now() });
  } catch(e) { console.warn("[SDC] Cloud save error:", e); }
}

async function loadFromCloud(uid) {
  if (!_fb || !uid) return null;
  try {
    const d = await window._sheyla.load();
    if (d) return _stripMeta(d);
  } catch(e) { console.warn("[SDC] Cloud load error:", e); }
  return null;
}
